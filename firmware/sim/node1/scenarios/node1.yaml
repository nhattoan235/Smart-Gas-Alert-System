name: 'Node 1 LPG levels and inspected recovery'
version: 1
author: 'Smart Gas Alert automated tests'
steps:
  - set-control:
      part-id: lpg
      name: position
      value: 0.03
  - set-control:
      part-id: co
      name: position
      value: 0.03
  - set-control:
      part-id: temp
      name: position
      value: 0.45
  - set-control:
      part-id: humid
      name: position
      value: 0.50
  - set-control:
      part-id: interference
      name: position
      value: 0.50
  - wait-serial: 'node1: LPG SAFE'
  - set-control:
      part-id: lpg
      name: position
      value: 0.18
  - wait-serial: 'node1: LPG WATCH'
  - expect-pin:
      part-id: esp
      name: '5'
      value: 0
  - expect-pin:
      part-id: esp
      name: '6'
      value: 1
  - set-control:
      part-id: lpg
      name: position
      value: 0.38
  - wait-serial: 'node1: LPG WARNING'
  - expect-pin:
      part-id: esp
      name: '6'
      value: 1
  - set-control:
      part-id: lpg
      name: position
      value: 0.80
  - wait-serial: 'node1: LPG DANGER'
  - expect-pin:
      part-id: esp
      name: '7'
      value: 1
  - expect-pin:
      part-id: esp
      name: '5'
      value: 0
  - set-control:
      part-id: lpg
      name: position
      value: 0.03
  - wait-serial: 'node1: LPG WATCH'
  - delay: 10000ms
  - set-control:
      part-id: inspect
      name: pressed
      value: 1
  - wait-serial: 'node1: LPG SAFE 3.0%, CO SAFE 3.0%'
  - set-control:
      part-id: inspect
      name: pressed
      value: 0
  - expect-pin:
      part-id: esp
      name: '5'
      value: 1
