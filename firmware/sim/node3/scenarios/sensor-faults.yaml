name: 'Node 3 CO and dual sensor fault, recovery and inspected clear'
version: 1
author: 'Smart Gas Alert automated tests'
steps:
  - set-control:
      part-id: lpg
      name: position
      value: 0.03
  - set-control:
      part-id: co
      name: position
      value: 0.03
  - set-control:
      part-id: temp
      name: position
      value: 0.45
  - set-control:
      part-id: humid
      name: position
      value: 0.50
  - set-control:
      part-id: interference
      name: position
      value: 0.50
  - wait-serial: 'node3: LPG SAFE'

  # CO-only fault must independently raise the system FAULT alarm.
  - set-control:
      part-id: coFault
      name: pressed
      value: 1
  - wait-serial: 'node3: LPG SAFE 3.0%, CO FAULT'
  - expect-pin:
      part-id: esp
      name: '7'
      value: 1
  - delay: 500ms
  - set-control:
      part-id: coFault
      name: pressed
      value: 0
  - wait-serial: 'node3: LPG SAFE 3.0%, CO WATCH'
  - delay: 10000ms
  - set-control:
      part-id: inspect
      name: pressed
      value: 1
  - wait-serial: 'node3: LPG SAFE 3.0%, CO SAFE 3.0%'
  - set-control:
      part-id: inspect
      name: pressed
      value: 0

  # Both fault inputs are held low together; releasing one must not clear the other.
  - set-control:
      part-id: lpgFault
      name: pressed
      value: 1
  - set-control:
      part-id: coFault
      name: pressed
      value: 1
  - wait-serial: 'node3: LPG FAULT 3.0%, CO FAULT'
  - expect-pin:
      part-id: esp
      name: '7'
      value: 1
  - delay: 500ms
  - set-control:
      part-id: lpgFault
      name: pressed
      value: 0
  - wait-serial: 'node3: LPG WATCH 3.0%, CO FAULT'
  - set-control:
      part-id: coFault
      name: pressed
      value: 0
  - wait-serial: 'node3: LPG WATCH 3.0%, CO WATCH'
  - delay: 10000ms
  - set-control:
      part-id: inspect
      name: pressed
      value: 1
  - wait-serial: 'node3: LPG SAFE 3.0%, CO SAFE 3.0%'
  - set-control:
      part-id: inspect
      name: pressed
      value: 0
  - expect-pin:
      part-id: esp
      name: '7'
      value: 0
  - expect-pin:
      part-id: esp
      name: '5'
      value: 1
