[platformio]
default_envs = node1, node2, node3

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
  espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
  platformio/framework-arduinoespressif32@3.20017.241212
  platformio/tool-esptoolpy@2.41100.0
monitor_speed = 115200
extra_scripts = pre:mqtt_build.py
build_flags =
  -D SIMULATION=1
  -D HOME_ID=\"demo-home\"

[env:node1]
build_flags =
  ${env.build_flags}
  -D DEVICE_ID=\"node1\"
  -D FLAME_MONITOR_ENABLED=1

[env:node2]
build_flags =
  ${env.build_flags}
  -D DEVICE_ID=\"node2\"

[env:node3]
build_flags =
  ${env.build_flags}
  -D DEVICE_ID=\"node3\"

; Isolated local Wokwi runtime target used only by tools/e2e/firmware_nvs_replay.py.
; It talks to the private-gateway test broker on loopback port 1884 and exposes
; serial controls only in this target; the normal node1/node2/node3 builds stay unchanged.
; Core log_e output is disabled only here to prevent reconnect diagnostics from
; interleaving with the test-only serial payload stream; application logs remain enabled.
[env:node1_nvs_runtime]
build_flags =
  -D SIMULATION=1
  -D HOME_ID=\"nvs-runtime-test\"
  -D MQTT_HOST=\"host.wokwi.internal\"
  -D MQTT_PORT=1884
  -D MQTT_USER=\"nvs-runtime-test\"
  -D DEVICE_ID=\"node1\"
  -D NVS_RUNTIME_TEST=1
  -D CORE_DEBUG_LEVEL=0
  -D FLAME_MONITOR_ENABLED=1

; Separate N8R8 compile target. The local board definition enables OPI PSRAM;
; it does not prove that the attached module has PSRAM or validate the hardware.
; Acquisition stays unconfigured and reports invalid/calibration-required until
; module address, ADC front-end, and calibration transform are verified.
[env:n8r8_hardware]
board = esp32-s3-devkitc-1-n8r8
build_flags =
  -D SIMULATION=0
  -D HARDWARE_N8R8=1
  -D N8R8_SENSOR_CONFIGURED=0
  -D HOME_ID=\"unconfigured-home\"
  -D DEVICE_ID=\"unconfigured-node\"
  -D WIFI_SSID=\"UNCONFIGURED\"
  -D WIFI_PASSWORD=\"\"
  -D MQTT_HOST=\"unconfigured.invalid\"
  -D MQTT_PORT=1883
  -D MQTT_USER=\"\"

; Compile-only TLS profile. A CA PEM must be supplied through
; GAS_MQTT_CA_CERT_FILE and the MQTT password through GAS_MQTT_PASSWORD.
; The reserved .invalid host prevents accidentally treating this as a live
; broker configuration; the standard node1/node2/node3 simulation profiles
; remain plain MQTT and unchanged.
[env:node1_mqtt_tls_compile]
build_flags =
  -D SIMULATION=1
  -D HOME_ID=\"security-test\"
  -D MQTT_HOST=\"mqtt-security.invalid\"
  -D MQTT_PORT=8884
  -D MQTT_USER=\"node1-test\"
  -D DEVICE_ID=\"node1\"
  -D MQTT_TLS=1
  -D FLAME_MONITOR_ENABLED=1

; Firmware-backed TLS runtime target. The test runner injects a random per-run
; password and CA, then runs this image in local Wokwi against an isolated
; TLS broker on the Private IoT Gateway. This never targets the demo broker.
[env:node1_mqtt_tls_runtime]
build_flags =
  -D SIMULATION=1
  -D HOME_ID=\"security-test\"
  -D MQTT_HOST=\"host.wokwi.internal\"
  -D MQTT_PORT=1884
  -D MQTT_USER=\"node1-test\"
  -D DEVICE_ID=\"node1\"
  -D MQTT_TLS=1
  -D FLAME_MONITOR_ENABLED=1
