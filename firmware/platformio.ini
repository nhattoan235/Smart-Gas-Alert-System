[platformio]
default_envs = node1, node2, node3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:mqtt_build.py
build_flags =
  -D SIMULATION=1
  -D HOME_ID=\"demo-home\"
  -D MQTT_HOST=\"192.168.22.128\"
  -D MQTT_PORT=1883
  -D MQTT_USER=\"iotlab\"

[env:node1]
build_flags =
  ${env.build_flags}
  -D DEVICE_ID=\"node1\"

[env:node2]
build_flags =
  ${env.build_flags}
  -D DEVICE_ID=\"node2\"

[env:node3]
build_flags =
  ${env.build_flags}
  -D DEVICE_ID=\"node3\"

; For real hardware create a separate [env:*] with SIMULATION=0, Wi-Fi
; credentials and MQTT broker address. See docs/hardware.md before wiring.
